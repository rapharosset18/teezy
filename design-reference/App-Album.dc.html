<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teezy shared album</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #111113; font-family: Instrument Sans, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 0; box-sizing: border-box; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 8px;">
    <a href="App-Friends.dc.html" aria-label="Back to friends" style="width: 40px; height: 44px; display: grid; place-items: center; margin-left: -8px; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">USC vs Arizona</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #63636B;">Sat, Oct 17 · Coliseum · 48 photos</p>
    </div>
    <button aria-label="Share album" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #F3F3F1; color: #111113; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="display: flex; flex-grow: 1; align-items: center; gap: 10px;">
      <span style="display: flex;">
        <span style="width: 32px; height: 32px; border-radius: 999px; background: #7A2738; color: #FFFFFF; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 2px #FFFFFF;">A</span>
        <span style="width: 32px; height: 32px; margin-left: -8px; border-radius: 999px; background: #2B3A80; color: #FFFFFF; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 2px #FFFFFF;">T</span>
        <span style="width: 32px; height: 32px; margin-left: -8px; border-radius: 999px; background: #4A3B2A; color: #FFFFFF; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 2px #FFFFFF;">N</span>
        <span style="width: 32px; height: 32px; margin-left: -8px; border-radius: 999px; background: #111113; color: #FFFFFF; display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 2px #FFFFFF;">R</span>
      </span>
      <span style="font-size: 13px; color: #3F4045;">You, Ana and 4 friends</span>
    </span>
    <a href="App-Album.dc.html" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #0A7D50; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add photos
    </a>
  </div>

  <p style="margin: -6px 0 0; font-size: 13px; color: #63636B;">Only friends who went can see and add to this album.</p>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; border-radius: 16px; overflow: hidden;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
      <span role="img" aria-label="{{t.label}}" style="{{t.style}}">
        <sc-if value="{{t.by}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: 6px; bottom: 6px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(17,17,19,0.62); color: #FFFFFF; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center;">{{t.by}}</span>
        </sc-if>
        <sc-if value="{{t.more}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; inset: 0; background: rgba(17,17,19,0.55); color: #FFFFFF; display: grid; place-items: center; font-size: 22px; font-weight: 700;">{{t.more}}</span>
        </sc-if>
      </span>
    </sc-for>
  </div>

  <a href="App-Friends.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #E3F3EB;">
    <span style="flex-grow: 1; font-size: 14px; line-height: 19px; color: #0A4D33;"><b>3 people from this album</b> are going to USC vs Oregon on Nov 21.</span>
    <span style="font-size: 14px; font-weight: 700; color: #0A7D50; white-space: nowrap;">Join them</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#8FA3B8', '#6B2D3A', '#C9B8A3', '#2F4A3C', '#D9C7B8', '#1F2A44', '#A8B5A0', '#B88F7A', '#4A3B2A', '#9A8FB0', '#3E4A5C', '#C2A88F'];
    const by = { 0: 'Ana', 4: 'Theo', 7: 'You' };
    const tiles = colors.map((c, i) => ({
      label: 'Photo ' + (i + 1) + (by[i] ? ' by ' + by[i] : ''),
      by: by[i] || false,
      more: i === 11 ? '+36' : false,
      style: 'position: relative; aspect-ratio: 1 / 1; background: ' + c + ';'
    }));
    return { tiles: tiles };
  }
}
</script>
</body>
</html>
