<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Teezy Main</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Layout: a phone-sized app, framed on wide screens and full-bleed on phones.
     Look: Swoosh. Archivo, neon orange on near-black, hairline borders, uppercase micro-labels. */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F2F2EC;
    --ink:#0E0E10;
    --ink-soft:#54555B;
    --ink-faint:#8A8B86;
    --line-soft:#E3E3DC;
    --accent:#FF6A13;
    --accent-ink:#0E0E10;
    --accent-wash:#FFE9DB;
    --trust:#17E88F;
    --trust-ink:#04150D;
    --trust-wash:#DDFBEC;
    --trust-text:#08703F;
    --danger:#D93025;
    --scrim:rgba(14,14,16,.45);
    --shadow:rgba(14,14,16,.16);
    --frame:#0E0E10;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .erow.connected .ecard-main{ box-shadow:0 8px 18px -10px rgba(0,0,0,.7); }
    :root:not([data-theme="light"]){
      --bg:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E;
      --ink:#F5F5F1; --ink-soft:#B9BAB6; --ink-faint:#85867F; --line-soft:#2A2A2C;
      --accent:#FF7A2B; --accent-ink:#0B0B0C; --accent-wash:#331B0C;
      --trust:#2EFFA0; --trust-ink:#04150D; --trust-wash:#0F2B1E; --trust-text:#5CF0AE;
      --danger:#FF6357; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.55); --frame:#000000;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] .erow.connected .ecard-main{ box-shadow:0 8px 18px -10px rgba(0,0,0,.7); }
  :root[data-theme="dark"]{
    --bg:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E;
    --ink:#F5F5F1; --ink-soft:#B9BAB6; --ink-faint:#85867F; --line-soft:#2A2A2C;
    --accent:#FF7A2B; --accent-ink:#0B0B0C; --accent-wash:#331B0C;
    --trust:#2EFFA0; --trust-ink:#04150D; --trust-wash:#0F2B1E; --trust-text:#5CF0AE;
    --danger:#FF6357; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.55); --frame:#000000;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--surface-2); color:var(--ink);
    font-family:'Archivo', system-ui, -apple-system, sans-serif;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:24px; display:flex; flex-direction:column; align-items:center; gap:16px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{ margin:0; }
  h1,h2,h3{ text-wrap:balance; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .intro{ width:min(420px,100%); text-align:center; display:flex; flex-direction:column; gap:4px; }
  .intro .word{ font-weight:900; font-size:1.9rem; letter-spacing:-.02em; }
  .intro .word i{ font-style:normal; display:inline-block; width:.32em; height:.32em; border-radius:2px; background:var(--accent); margin-left:2px; box-shadow:0 0 0 1.5px var(--ink); }
  .intro p{ color:var(--ink-soft); font-size:.86rem; line-height:1.5; }

  .phone{ width:min(392px,100%); height:min(844px, calc(100dvh - 140px)); min-height:600px; background:var(--frame); border-radius:46px; padding:11px; box-shadow:0 30px 60px -20px var(--shadow), 0 2px 8px var(--shadow); flex-shrink:0; }
  .screen{ position:relative; width:100%; height:100%; background:var(--bg); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; }
  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 26px 2px; font-size:.8rem; font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:110px; height:26px; background:var(--frame); border-radius:0 0 16px 16px; z-index:40; }

  @media (max-width:520px){
    body{ padding:0; background:var(--bg); }
    .intro{ display:none; }
    .phone{ width:100%; height:100dvh; min-height:0; border-radius:0; padding:0; box-shadow:none; background:var(--bg); }
    .screen{ border-radius:0; }
    .notch, .statusbar{ display:none; }
    .screen{ padding-top:env(safe-area-inset-top, 0px); }
  }

  /* ---------- views ---------- */
  #view{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  .hd{ flex-shrink:0; padding:10px 18px 12px; display:flex; flex-direction:column; gap:12px; }
  .hd.line{ border-bottom:1.5px solid var(--line-soft); }
  .evhero{ position:relative; flex-shrink:0; height:210px; background:center 42%/cover no-repeat; display:flex; align-items:flex-end; padding:14px 18px; color:#FFFFFF; font-weight:900; font-size:1.9rem; line-height:1; letter-spacing:-.01em; white-space:pre-line; }
  .evhero .hbtns{ position:absolute; left:14px; right:14px; top:12px; display:flex; justify-content:space-between; }
  .evhero .backbtn, .evhero .iconbtn{ border-color:transparent; box-shadow:0 2px 10px rgba(0,0,0,.18); }
  .evhero + .hd{ padding-top:14px; }
  .evhero + .hd .chip{ height:32px; padding:0 12px; font-size:.74rem; }
  .qtychips .chip{ height:32px; min-width:44px; justify-content:center; }
  .qtychips .chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .matchline{ margin:2px 0 0; text-align:center; font-size:.78rem; font-weight:800; color:var(--trust); }
  .matchline.none{ color:var(--ink-soft); font-weight:700; }
  .lrow.dim{ opacity:.5; }
  .okpill{ display:inline-block; margin-left:6px; vertical-align:2px; font-size:.6rem; font-weight:800; padding:2px 7px; border-radius:999px; background:color-mix(in srgb, var(--trust) 16%, transparent); color:var(--trust); }
  .seatsheet{ touch-action:none; }
  .uphint{ align-self:center; display:flex; flex-direction:column; align-items:center; gap:0; border:none; background:none; padding:0 12px 2px; margin-top:-4px; color:var(--ink-soft); font-size:.7rem; font-weight:800; cursor:grab; }
  .uphint .upa{ display:grid; place-items:center; animation:bob 1.4s ease-in-out infinite; }
  .uphint .upa svg{ transform:rotate(-90deg); }
  @keyframes bob{ 0%, 100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @media (prefers-reduced-motion: reduce){ .uphint .upa{ animation:none; } }
  .body{ flex:1; min-height:0; overflow-y:auto; padding:4px 18px 24px; display:flex; flex-direction:column; gap:18px; overscroll-behavior:contain; scrollbar-width:none; }
  .body::-webkit-scrollbar{ display:none; }
  .body > *{ flex-shrink:0; }
  .foot{ flex-shrink:0; padding:12px 18px 18px; border-top:1.5px solid var(--line-soft); display:flex; flex-direction:column; gap:10px; background:var(--bg); }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .grow{ flex:1; min-width:0; }

  .eyebrow{ font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); }
  .title{ font-size:1.75rem; font-weight:900; letter-spacing:-.02em; line-height:1.05; }
  .h2{ font-size:1.12rem; font-weight:900; letter-spacing:-.01em; }
  .sub{ font-size:.8rem; color:var(--ink-soft); line-height:1.4; }
  .faint{ color:var(--ink-faint); }
  .num{ font-variant-numeric:tabular-nums; }
  .link{ background:none; border:none; padding:0; font-weight:800; font-size:.8rem; color:var(--ink); text-decoration:underline; text-underline-offset:3px; }

  .backbtn, .iconbtn{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink); display:grid; place-items:center; flex-shrink:0; padding:0; }
  .iconbtn.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .avatar{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:.86rem; flex-shrink:0; border:none; padding:0; color:#FFFFFF; position:relative; }
  .avatar.me{ background:var(--ink); color:var(--bg); }
  .avatar .nb{ position:absolute; top:-6px; left:100%; transform:translateX(-60%); min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:var(--accent); color:#0E0E10; font-size:.66rem; font-weight:900; display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg), inset 0 0 0 1.5px #0E0E10; }
  /* notification badges: pop in when a count goes up, bump when it changes, shrink away when cleared */
  .nb-pop{ animation:nbpop .45s cubic-bezier(.34,1.6,.64,1) both; }
  .nb-bump{ animation:nbbump .35s ease both; }
  .nb-out{ animation:nbout .25s ease-in forwards; pointer-events:none; }
  .nb-ring{ animation:nbring .6s ease both; transform-origin:50% 10%; }
  @keyframes nbpop{ 0%{ scale:0; } 60%{ scale:1.25; } 100%{ scale:1; } }
  @keyframes nbbump{ 0%{ scale:1; } 40%{ scale:1.3; } 100%{ scale:1; } }
  @keyframes nbout{ to{ scale:0; opacity:0; } }
  @keyframes nbring{ 0%,100%{ rotate:0deg; } 20%{ rotate:14deg; } 40%{ rotate:-12deg; } 60%{ rotate:8deg; } 80%{ rotate:-4deg; } }
  .avatar.me:active{ scale:.94; transition:scale .1s; }
  .avatar.sm{ width:32px; height:32px; font-size:.72rem; }
  .avatar.xs{ width:26px; height:26px; font-size:.62rem; box-shadow:0 0 0 2px var(--bg); }
  .faces{ display:flex; }
  .faces .avatar + .avatar{ margin-left:-7px; }

  /* buttons */
  .btn{ border:none; border-radius:12px; height:48px; padding:0 18px; font-weight:800; font-size:.9rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 1.5px var(--ink); }
  .btn-ink{ background:var(--ink); color:var(--bg); }
  .btn-trust{ background:var(--trust); color:var(--trust-ink); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border:1.5px solid var(--line-soft); }
  .btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn-sm{ height:36px; padding:0 14px; font-size:.8rem; border-radius:999px; }
  .btn-full{ width:100%; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; }
  .btn-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .btn-grid.three{ grid-template-columns:repeat(3,minmax(0,1fr)); }

  /* chips + segmented */
  .chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips.wrap{ flex-wrap:wrap; overflow:visible; margin:0; padding:0; }
  .chip{ flex-shrink:0; height:36px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink); font-weight:700; font-size:.8rem; display:inline-flex; align-items:center; gap:6px; }
  .chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.soft{ background:var(--surface-2); border-color:transparent; }
  /* tab rows whose dark highlight slides to the tab you pick (same 0.3s motion as the bottom bar) */
  .slidetabs{ position:relative; }
  .slidetabs .chip{ position:relative; z-index:1; background:transparent; transition:color .3s cubic-bezier(.4,0,.2,1); }
  .slidetabs .chip.on{ background:transparent; border-color:transparent; }
  .actwrap{ position:relative; flex-shrink:0; overflow:hidden; margin:0 -18px; padding:0 18px; }
  .tabpill{ position:absolute; top:0; left:0; height:36px; border-radius:999px; background:var(--ink); pointer-events:none; transition:left .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1); }
  @media (prefers-reduced-motion: reduce){ .tabpill{ transition:none; } }
  .chip .count{ font-size:.66rem; font-weight:800; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:1px 6px; }
  .seg{ display:flex; gap:3px; background:var(--surface-2); border:1.5px solid var(--line-soft); border-radius:12px; padding:3px; }
  .seg button{ flex:1; height:36px; border:none; border-radius:9px; background:transparent; font-weight:800; font-size:.8rem; color:var(--ink-soft); }
  .seg button.on{ background:var(--ink); color:var(--bg); }
  .seg.big button{ height:42px; font-size:.95rem; letter-spacing:.04em; text-transform:uppercase; }

  /* cards + rows */
  .card{ background:var(--surface); border:1.5px solid var(--line-soft); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .card.ink{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .card.ink .sub{ color:color-mix(in srgb, var(--bg) 70%, transparent); }
  .card.lime{ background:var(--accent-wash); border-color:var(--accent-wash); }
  .card.trust{ background:var(--trust-wash); border-color:var(--trust-wash); }
  .card.focus{ border-color:var(--ink); }
  .card.row{ flex-direction:row; align-items:center; }
  .tap{ width:100%; text-align:left; background:var(--surface); color:var(--ink); }
  .list{ display:flex; flex-direction:column; }
  .lrow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border:none; border-bottom:1.5px solid var(--line-soft); background:none; text-align:left; width:100%; color:var(--ink); }
  .lrow.two{ grid-template-columns:minmax(0,1fr) auto; }
  .lrow:last-child{ border-bottom:none; }
  .lt{ font-size:.95rem; font-weight:800; display:block; }
  .ls{ font-size:.78rem; color:var(--ink-soft); display:block; margin-top:2px; }
  .price{ font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .price small{ display:block; font-size:.66rem; font-weight:700; color:var(--ink-faint); }
  .date{ width:50px; height:54px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--line-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .date b{ font-size:1.2rem; font-weight:900; line-height:1; }
  .date span{ font-size:.6rem; font-weight:800; letter-spacing:.07em; color:var(--ink-soft); }
  .pill{ font-size:.66rem; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .pill-lime{ background:var(--accent); color:var(--accent-ink); }
  .pill-trust{ background:var(--trust-wash); color:var(--trust-text); }
  .pill-ink{ background:var(--ink); color:var(--bg); }
  .pill-soft{ background:var(--surface-2); color:var(--ink-soft); border:1.5px solid var(--line-soft); }
  .tag{ font-size:.72rem; font-weight:800; color:var(--trust-text); }
  .tile{ position:relative; border-radius:14px; padding:12px; display:flex; align-items:flex-end; color:#FFFFFF; font-weight:900; font-size:1.2rem; line-height:1.02; letter-spacing:-.01em; white-space:pre-line; overflow:hidden; }
  .tile .heart{ position:absolute; top:10px; right:10px; }
  .tile .flag{ position:absolute; top:10px; left:10px; background:var(--accent); color:var(--accent-ink); font-size:.62rem; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:0; }
  .hscroll{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px; }
  .hscroll::-webkit-scrollbar{ display:none; }
  .rowhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .rowctl{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .erow{ display:flex; gap:12px; overflow-x:auto; margin:0 -18px; padding:6px 18px 14px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .erow::-webkit-scrollbar{ display:none; }
  /* Cards follow the scroll: the one in focus is full size, the rest ease back (springy curve). */
  .ecard{ position:relative; flex:0 0 240px; transition:transform .32s cubic-bezier(.34,1.4,.64,1), opacity .32s ease; will-change:transform; }
  /* Coming up: connected carousel cards, joined by curved bridges */
  .erow.connected{ gap:14px; }
  .erow.connected .ecard-main{ background:var(--surface-2); border:none; border-radius:24px; box-shadow:0 8px 18px -10px rgba(95,109,119,.35); }
  .erow.connected .ecard-main:hover{ box-shadow:0 10px 22px -10px rgba(95,109,119,.45); }
  .ecard-link{ position:absolute; top:50%; left:calc(100% - 1px); width:16px; height:42px; margin-top:-21px; color:var(--surface-2); pointer-events:none; z-index:2; }
  .ecard-link svg{ display:block; width:100%; height:100%; fill:currentColor; overflow:visible; }
  .pills{ display:flex; justify-content:center; align-items:center; gap:6px; margin-top:-4px; }
  .pills button{ height:8px; width:8px; border-radius:4px; border:none; padding:0; background:var(--line-soft); overflow:hidden; transition:width .3s ease-out, background .2s; }
  .pills button.on{ width:56px; }
  .pills .fill{ display:block; height:100%; width:100%; border-radius:4px; background:var(--ink); transform-origin:0 50%; transform:scaleX(0); animation:pillfill 4s linear forwards; }
  .pills.paused .fill{ animation-play-state:paused; }
  @keyframes pillfill{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .ecard-main{ display:flex; flex-direction:column; width:100%; height:304px; padding:0; border:1.5px solid var(--line-soft); border-radius:16px; overflow:hidden; background:var(--surface); color:var(--ink); text-align:left; transition:box-shadow .2s ease, border-color .2s ease; }
  .ecard-main:hover{ border-color:var(--ink); box-shadow:0 8px 20px -10px var(--shadow); }
  .ecard-img{ position:relative; flex-shrink:0; display:flex; align-items:flex-end; width:100%; aspect-ratio:4/3; padding:12px; background:center top/cover no-repeat; color:#FFFFFF; font-weight:900; font-size:1.35rem; line-height:1.02; letter-spacing:-.01em; white-space:pre-line; overflow:hidden; }
  .ecard-img .flag{ position:absolute; top:10px; left:10px; background:var(--accent); color:var(--accent-ink); font-size:.66rem; font-weight:800; padding:4px 9px; border-radius:999px; box-shadow:inset 0 0 0 1.5px #0E0E10; letter-spacing:0; line-height:1.2; }
  .ecard-body{ flex:1; min-height:0; display:flex; flex-direction:column; gap:2px; padding:10px 12px 12px; }
  .ecard-t{ font-size:.94rem; font-weight:800; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ecard-s{ font-size:.76rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ecard-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.76rem; color:var(--ink-soft); }
  .ecard-foot .n{ display:inline-flex; align-items:center; gap:4px; }
  .ecard-foot .n svg{ width:14px; height:14px; }
  .ecard-foot b{ color:var(--ink); font-weight:900; font-size:.9rem; font-variant-numeric:tabular-nums; }
  .ecard-heart{ position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.88); color:#0E0E10; display:grid; place-items:center; padding:0; }
  .ecard-heart.on{ background:var(--accent); box-shadow:inset 0 0 0 1.5px #0E0E10; color:#0E0E10; }
  .ecard-heart svg{ width:18px; height:18px; }
  /* Home: watchlist chips, near-you map, more-events grid */
  .wchips{ display:flex; gap:8px; overflow-x:auto; margin:0 -18px; padding:2px 18px 4px; scrollbar-width:none; }
  .wchips::-webkit-scrollbar{ display:none; }
  .wchip{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border:1.5px solid var(--line-soft); border-radius:999px; background:var(--surface); color:var(--ink); text-align:left; }
  .wchip:hover{ border-color:var(--ink); }
  .wchip .th{ width:34px; height:34px; border-radius:50%; flex-shrink:0; background:center/cover no-repeat; display:grid; place-items:center; color:#FFFFFF; font-size:.58rem; font-weight:900; line-height:1; text-align:center; white-space:pre-line; }
  .wchip .lt{ font-size:.8rem; display:block; white-space:nowrap; }
  .wchip .ls{ font-size:.7rem; display:block; white-space:nowrap; }
  .wchip .ls b{ color:var(--trust-text); font-weight:800; }
  .nmap{ position:relative; height:168px; border-radius:16px; overflow:hidden; border:1.5px solid var(--line-soft); background:var(--surface-2); }
  .nmap svg.base{ position:absolute; inset:0; width:100%; height:100%; }
  .nmap .street{ stroke:var(--bg); fill:none; }
  .nmap .park{ fill:var(--trust-wash); }
  .nmap .ring{ fill:none; stroke:var(--ink-faint); stroke-width:1; stroke-dasharray:3 4; }

function radiusMi(){ return { '1 mi':1, '5 mi':5, '25 mi':25, 'Any':999 }[S.where.radius]; }
function inWhen(e, when){
  when = when || S.where.when;
  if (e.startsAt) {
    var date = new Date(e.startsAt), now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.floor((date - start) / 86400000);
    if (when === 'Today') return days === 0;
    if (when === 'This weekend') { var saturday = (6 - now.getDay() + 7) % 7; return days === saturday || days === saturday + 1; }
    if (when === 'This week') return days >= 0 && days < 7;
    if (when === 'This month') return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date >= start;
    return date.getMonth() === 10 && date.getFullYear() === 2026 && date.getDate() >= S.where.range[0] && date.getDate() <= S.where.range[1];
  }
  if (when === 'Today') return e.day === TODAY;
  if (when === 'This weekend') return e.day === 7 || e.day === 8;
  if (when === 'This week') return e.day >= TODAY && e.day <= 8;
  if (when === 'This month') return e.day >= TODAY;
  return e.day >= S.where.range[0] && e.day <= S.where.range[1];
}

// Sell side of an event: your ticket with a price coach, buyers who'd take it right now, and how much demand there is.

// Seven days of the lowest price for a game: falls to today's price when it dropped, wobbles when it didn't.
function priceHist(id){
  var now = fromPrice(id);
  if (now == null) return null;
  var seed = 0, rnd = function(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (var i = 0; i < id.length; i++) seed += id.charCodeAt(i) * 97;
  var start = S.drops[id] ? now + Math.max(2, Math.round(now * 0.12)) : now;
  return Array.from({ length:7 }, function(_, k){ return k === 0 ? start : k === 6 ? now : Math.round(start + (now - start) * (k / 6) + (rnd() - 0.5) * Math.max(1, now * 0.04)); });
}
// 30 days of the lowest price: the same last week as the small graph, plus three weeks before it.
function priceSeries(id){
  var h7 = priceHist(id);
  if (!h7) return null;

// Every offer and counter is picked on one price slider: the green band is what similar seats

  var lo = Math.min.apply(null, [e.range[0]].concat(pts)), hi = Math.max.apply(null, [e.range[1]].concat(pts));

  if (p < fair[0]) return ['Below what similar seats sold for', 'warn'];
  if (p > fair[1]) return ['Above what similar seats sold for', 'warn'];

}
