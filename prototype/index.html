<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teezy Main</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Layout: a phone-sized app, framed on wide screens and full-bleed on phones.
     Look: Swoosh. Archivo, lime on near-black, hairline borders, uppercase micro-labels. */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F2F2EC;
    --ink:#0E0E10;
    --ink-soft:#54555B;
    --ink-faint:#8A8B86;
    --line-soft:#E3E3DC;
    --accent:#D6FF3F;
    --accent-ink:#0E0E10;
    --accent-wash:#F3FFC9;
    --trust:#17E88F;
    --trust-ink:#04150D;
    --trust-wash:#DDFBEC;
    --trust-text:#08703F;
    --danger:#D93025;
    --scrim:rgba(14,14,16,.45);
    --shadow:rgba(14,14,16,.16);
    --frame:#0E0E10;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E;
      --ink:#F5F5F1; --ink-soft:#B9BAB6; --ink-faint:#85867F; --line-soft:#2A2A2C;
      --accent:#E3FF5C; --accent-ink:#0B0B0C; --accent-wash:#262A12;
      --trust:#2EFFA0; --trust-ink:#04150D; --trust-wash:#0F2B1E; --trust-text:#5CF0AE;
      --danger:#FF6357; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.55); --frame:#000000;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E;
    --ink:#F5F5F1; --ink-soft:#B9BAB6; --ink-faint:#85867F; --line-soft:#2A2A2C;
    --accent:#E3FF5C; --accent-ink:#0B0B0C; --accent-wash:#262A12;
    --trust:#2EFFA0; --trust-ink:#04150D; --trust-wash:#0F2B1E; --trust-text:#5CF0AE;
    --danger:#FF6357; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.55); --frame:#000000;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--surface-2); color:var(--ink);
    font-family:'Archivo', system-ui, -apple-system, sans-serif;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:24px; display:flex; flex-direction:column; align-items:center; gap:16px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{ margin:0; }
  h1,h2,h3{ text-wrap:balance; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .intro{ width:min(420px,100%); text-align:center; display:flex; flex-direction:column; gap:4px; }
  .intro .word{ font-weight:900; font-size:1.9rem; letter-spacing:-.02em; }
  .intro .word i{ font-style:normal; display:inline-block; width:.32em; height:.32em; border-radius:2px; background:var(--accent); margin-left:2px; box-shadow:0 0 0 1.5px var(--ink); }
  .intro p{ color:var(--ink-soft); font-size:.86rem; line-height:1.5; }

  .phone{ width:min(392px,100%); height:min(844px, calc(100dvh - 140px)); min-height:600px; background:var(--frame); border-radius:46px; padding:11px; box-shadow:0 30px 60px -20px var(--shadow), 0 2px 8px var(--shadow); flex-shrink:0; }
  .screen{ position:relative; width:100%; height:100%; background:var(--bg); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; }
  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 26px 2px; font-size:.8rem; font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .notch{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:110px; height:26px; background:var(--frame); border-radius:0 0 16px 16px; z-index:40; }

  @media (max-width:520px){
    body{ padding:0; background:var(--bg); }
    .intro{ display:none; }
    .phone{ width:100%; height:100dvh; min-height:0; border-radius:0; padding:0; box-shadow:none; background:var(--bg); }
    .screen{ border-radius:0; }
    .notch, .statusbar{ display:none; }
    .screen{ padding-top:env(safe-area-inset-top, 0px); }
  }

  /* ---------- views ---------- */
  #view{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  .hd{ flex-shrink:0; padding:10px 18px 12px; display:flex; flex-direction:column; gap:12px; }
  .hd.line{ border-bottom:1.5px solid var(--line-soft); }
  .body{ flex:1; min-height:0; overflow-y:auto; padding:4px 18px 24px; display:flex; flex-direction:column; gap:18px; overscroll-behavior:contain; scrollbar-width:none; }
  .body::-webkit-scrollbar{ display:none; }
  .body > *{ flex-shrink:0; }
  .foot{ flex-shrink:0; padding:12px 18px 18px; border-top:1.5px solid var(--line-soft); display:flex; flex-direction:column; gap:10px; background:var(--bg); }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .grow{ flex:1; min-width:0; }

  .eyebrow{ font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); }
  .title{ font-size:1.75rem; font-weight:900; letter-spacing:-.02em; line-height:1.05; }
  .h2{ font-size:1.12rem; font-weight:900; letter-spacing:-.01em; }
  .sub{ font-size:.8rem; color:var(--ink-soft); line-height:1.4; }
  .faint{ color:var(--ink-faint); }
  .num{ font-variant-numeric:tabular-nums; }
  .link{ background:none; border:none; padding:0; font-weight:800; font-size:.8rem; color:var(--ink); text-decoration:underline; text-underline-offset:3px; }

  .backbtn, .iconbtn{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink); display:grid; place-items:center; flex-shrink:0; padding:0; }
  .iconbtn.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .avatar{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:.86rem; flex-shrink:0; border:none; padding:0; color:#FFFFFF; position:relative; }
  .avatar.me{ background:var(--ink); color:var(--bg); }
  .avatar .dot{ position:absolute; top:-1px; right:-1px; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }
  .avatar.sm{ width:32px; height:32px; font-size:.72rem; }
  .avatar.xs{ width:26px; height:26px; font-size:.62rem; box-shadow:0 0 0 2px var(--bg); }
  .faces{ display:flex; }
  .faces .avatar + .avatar{ margin-left:-7px; }

  /* buttons */
  .btn{ border:none; border-radius:12px; height:48px; padding:0 18px; font-weight:800; font-size:.9rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 1.5px var(--ink); }
  .btn-ink{ background:var(--ink); color:var(--bg); }
  .btn-trust{ background:var(--trust); color:var(--trust-ink); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border:1.5px solid var(--line-soft); }
  .btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn-sm{ height:36px; padding:0 14px; font-size:.8rem; border-radius:999px; }
  .btn-full{ width:100%; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; }
  .btn-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .btn-grid.three{ grid-template-columns:repeat(3,minmax(0,1fr)); }

  /* chips + segmented */
  .chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips.wrap{ flex-wrap:wrap; overflow:visible; margin:0; padding:0; }
  .chip{ flex-shrink:0; height:36px; padding:0 14px; border-radius:999px; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink); font-weight:700; font-size:.8rem; display:inline-flex; align-items:center; gap:6px; }
  .chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.soft{ background:var(--surface-2); border-color:transparent; }
  .chip .count{ font-size:.66rem; font-weight:800; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:1px 6px; }
  .seg{ display:flex; gap:3px; background:var(--surface-2); border:1.5px solid var(--line-soft); border-radius:12px; padding:3px; }
  .seg button{ flex:1; height:36px; border:none; border-radius:9px; background:transparent; font-weight:800; font-size:.8rem; color:var(--ink-soft); }
  .seg button.on{ background:var(--ink); color:var(--bg); }
  .seg.big button{ height:42px; font-size:.95rem; letter-spacing:.04em; text-transform:uppercase; }

  /* cards + rows */
  .card{ background:var(--surface); border:1.5px solid var(--line-soft); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .card.ink{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .card.ink .sub{ color:color-mix(in srgb, var(--bg) 70%, transparent); }
  .card.lime{ background:var(--accent-wash); border-color:var(--accent-wash); }
  .card.trust{ background:var(--trust-wash); border-color:var(--trust-wash); }
  .card.focus{ border-color:var(--ink); }
  .card.row{ flex-direction:row; align-items:center; }
  .tap{ width:100%; text-align:left; background:var(--surface); color:var(--ink); }
  .list{ display:flex; flex-direction:column; }
  .lrow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border:none; border-bottom:1.5px solid var(--line-soft); background:none; text-align:left; width:100%; color:var(--ink); }
  .lrow.two{ grid-template-columns:minmax(0,1fr) auto; }
  .lrow:last-child{ border-bottom:none; }
  .lt{ font-size:.95rem; font-weight:800; display:block; }
  .ls{ font-size:.78rem; color:var(--ink-soft); display:block; margin-top:2px; }
  .price{ font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .price small{ display:block; font-size:.66rem; font-weight:700; color:var(--ink-faint); }
  .date{ width:50px; height:54px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--line-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .date b{ font-size:1.2rem; font-weight:900; line-height:1; }
  .date span{ font-size:.6rem; font-weight:800; letter-spacing:.07em; color:var(--ink-soft); }
  .pill{ font-size:.66rem; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .pill-lime{ background:var(--accent); color:var(--accent-ink); }
  .pill-trust{ background:var(--trust-wash); color:var(--trust-text); }
  .pill-ink{ background:var(--ink); color:var(--bg); }
  .pill-soft{ background:var(--surface-2); color:var(--ink-soft); border:1.5px solid var(--line-soft); }
  .tag{ font-size:.72rem; font-weight:800; color:var(--trust-text); }
  .tile{ position:relative; border-radius:14px; padding:12px; display:flex; align-items:flex-end; color:#FFFFFF; font-weight:900; font-size:1.2rem; line-height:1.02; letter-spacing:-.01em; white-space:pre-line; overflow:hidden; }
  .tile .heart{ position:absolute; top:10px; right:10px; }
  .tile .flag{ position:absolute; top:10px; left:10px; background:var(--accent); color:var(--accent-ink); font-size:.62rem; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:0; }
  .hscroll{ display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px; }
  .hscroll::-webkit-scrollbar{ display:none; }
  .posters{ display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -18px; padding:0 18px 2px; scrollbar-width:none; }
  .posters::-webkit-scrollbar{ display:none; }
  .poster{ flex:0 0 76%; scroll-snap-align:center; border:none; background:none; padding:0; text-align:center; color:var(--ink); display:flex; flex-direction:column; align-items:center; }
  .poster .img{ display:block; width:100%; aspect-ratio:4/5; border-radius:16px; background:var(--surface-2) center top/cover no-repeat; border:1.5px solid var(--line-soft); }
  .poster .cap1{ margin-top:10px; font-size:1.05rem; font-weight:900; }
  .poster .cap2{ font-size:.8rem; color:var(--ink-soft); margin-top:2px; }
  .dots{ display:flex; gap:10px; justify-content:center; }
  .dots button{ width:11px; height:11px; border-radius:50%; border:1.5px solid var(--ink); background:transparent; padding:0; }
  .dots button.on{ background:var(--accent); }
  .buynow{ align-self:center; min-width:62%; }
  .wcard{ width:146px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; border:none; background:none; padding:0; text-align:left; color:var(--ink); }
  .search{ display:flex; align-items:center; gap:10px; height:50px; padding:0 16px; border-radius:999px; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink-soft); font-size:.95rem; width:100%; text-align:left; }
  .search.active{ border-color:var(--ink); color:var(--ink); }
  .search input{ flex:1; min-width:0; border:none; background:transparent; outline:none; font-size:1rem; }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .stat{ display:flex; flex-direction:column; gap:4px; padding:14px; border-radius:16px; border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink); text-align:left; }
  .stat .k{ font-size:.8rem; font-weight:700; color:var(--ink-soft); }
  .stat .v{ font-size:1.7rem; font-weight:900; line-height:1.05; font-variant-numeric:tabular-nums; }
  .stat .s{ font-size:.76rem; color:var(--ink-soft); }
  .stat .s.hot{ color:var(--ink); font-weight:800; }
  .stepper{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .stepper button{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line-soft); background:var(--surface); font-size:1.3rem; font-weight:800; padding:0; }
  .stepper .amt{ font-size:2.2rem; font-weight:900; letter-spacing:-.03em; min-width:110px; text-align:center; font-variant-numeric:tabular-nums; }
  .stepper .amt small{ font-size:.8rem; font-weight:700; color:var(--ink-soft); letter-spacing:0; }
  .opt{ border:1.5px solid var(--line-soft); background:var(--surface); border-radius:14px; padding:12px 8px; display:flex; flex-direction:column; gap:2px; align-items:center; color:var(--ink); }
  .opt b{ font-size:1.15rem; font-weight:900; font-variant-numeric:tabular-nums; }
  .opt span{ font-size:.72rem; font-weight:700; color:var(--ink-soft); }
  .opt.on{ border-color:var(--ink); background:var(--accent); color:var(--accent-ink); }
  .opt.on span{ color:var(--accent-ink); }
  .radio{ width:22px; height:22px; border-radius:50%; border:2px solid var(--line-soft); flex-shrink:0; }
  .radio.on{ border:7px solid var(--ink); background:var(--accent); }
  .toggle{ width:46px; height:28px; border-radius:999px; border:none; background:var(--line-soft); position:relative; flex-shrink:0; padding:0; }
  .toggle::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px var(--shadow); transition:left .15s ease; }
  .toggle.on{ background:var(--ink); }
  .toggle.on::after{ left:21px; background:var(--accent); }
  .field{ width:100%; height:48px; border-radius:12px; border:1.5px solid var(--line-soft); background:var(--surface); padding:0 14px; font-size:1rem; font-weight:600; color:var(--ink); }
  .field:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  label.lbl{ font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .shield{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line-soft); font-size:.84rem; line-height:1.4; }
  .shield svg{ flex-shrink:0; color:var(--trust-text); }
  .history{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:.78rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .history span{ padding:4px 8px; border-radius:8px; background:var(--surface-2); }
  .history span.last{ background:var(--accent); color:var(--accent-ink); }
  .empty{ text-align:center; color:var(--ink-faint); font-size:.84rem; font-weight:600; padding:18px 10px; line-height:1.45; }
  .divider{ height:1.5px; background:var(--line-soft); }
  .barcode{ height:56px; border-radius:4px; background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 7px, transparent 7px 9px, var(--ink) 9px 13px, transparent 13px 16px); }
  .ticket{ border:1.5px solid var(--ink); border-radius:18px; overflow:hidden; background:var(--surface); }
  .ticket .top{ padding:14px; display:flex; flex-direction:column; gap:10px; }
  .ticket .cols{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .ticket .cols span{ display:block; font-size:.64rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .ticket .cols b{ font-size:1.05rem; font-weight:900; }
  .ticket .held{ background:var(--accent); color:var(--accent-ink); padding:10px 14px; font-size:.8rem; font-weight:800; display:flex; align-items:center; gap:8px; border-top:1.5px solid var(--ink); }
  .ticket .acts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1.5px solid var(--line-soft); }
  .ticket .acts button{ height:46px; border:none; background:none; font-weight:800; font-size:.86rem; color:var(--ink); }
  .ticket .acts button + button{ border-left:1.5px solid var(--line-soft); }
  .bar{ display:flex; gap:3px; height:12px; border-radius:999px; overflow:hidden; background:var(--surface-2); }
  .bar span{ min-width:0; }
  .key{ display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:10px; align-items:start; }
  .key .sw{ width:12px; height:12px; border-radius:4px; margin-top:3px; border:1.5px solid var(--ink); }
  .cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; text-align:center; }
  .cal .dow{ font-size:.66rem; font-weight:800; color:var(--ink-soft); padding:4px 0; }
  .cal button{ height:44px; border:none; background:none; border-radius:12px; font-weight:700; font-size:.9rem; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-variant-numeric:tabular-nums; padding:0; }
  .cal button.today{ box-shadow:inset 0 0 0 1.5px var(--ink); }
  .cal button.sel{ background:var(--ink); color:var(--bg); }
  .cal button.inrange{ background:var(--accent); color:var(--accent-ink); }
  .cal .dots{ display:flex; gap:3px; height:5px; }
  .cal .dots i{ width:5px; height:5px; border-radius:50%; }
  .photos{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
  .photos > *{ aspect-ratio:1; border-radius:8px; position:relative; display:flex; align-items:flex-end; padding:6px; color:#FFFFFF; font-size:.66rem; font-weight:800; }

  /* chat */
  .chat-log{ display:flex; flex-direction:column; gap:8px; }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:18px; font-size:.9rem; line-height:1.38; font-weight:500; }
  .bubble.them{ align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:6px; }
  .bubble.me{ align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:6px; }
  .sys{ align-self:center; font-size:.72rem; font-weight:700; color:var(--ink-faint); text-align:center; }
  .offerb{ max-width:72%; border:1.5px solid var(--line-soft); border-radius:16px; padding:10px 13px; display:flex; flex-direction:column; gap:2px; }
  .offerb.me{ align-self:flex-end; border-color:var(--ink); }
  .offerb.them{ align-self:flex-start; }
  .offerb span{ font-size:.7rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); }
  .offerb b{ font-size:1.4rem; font-weight:900; font-variant-numeric:tabular-nums; }
  .typing{ align-self:flex-start; display:flex; gap:4px; padding:12px 14px; background:var(--surface-2); border-radius:18px; }
  .typing i{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:blink 1.1s infinite ease-in-out; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
  .quick{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }

function nm(n){ return String(n).replace(/\.$/, ''); }
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
function initials(n){ return n === 'Sig Ep' ? 'ΣΦ' : n.split(/\s+/).map(function(w){ return w[0]; }).join('').slice(0, 2).toUpperCase(); }
function av(name, cls){ return '<span class="avatar ' + (cls || '') + '" style="background:' + (PEOPLE[name] || '#3E4A5C') + '">' + esc(initials(name)) + '</span>'; }
function listing(id){ return S.listings.filter(function(l){ return l.id === id; })[0]; }
function seatLabel(l){ return l.sec + (l.row ? ', ' + l.row : ''); }
function fromPrice(ev){ var p = S.listings.filter(function(l){ return l.ev === ev; }).map(function(l){ return l.price; }); return p.length ? Math.min.apply(null, p) : null; }
function countFor(ev){ return S.listings.filter(function(l){ return l.ev === ev; }).length; }
function dateBox(e){ return '<span class="date"><span>' + e.dow + '</span><b>' + (e.day > 0 ? String(e.day).padStart(2, '0') : '17') + '</b></span>'; }
function tile(ev, h, extra){
  var e = EV[ev];
  if (e.poster) return '<span class="tile" role="img" aria-label="' + esc(e.name) + ' poster" style="height:' + (h || 110) + 'px;background:' + e.color + ' url(\'' + e.poster + '\') center top/cover">' + (extra || '') + '</span>';
  return '<span class="tile" style="height:' + (h || 110) + 'px;background:' + e.color + '">' + esc(e.short) + (extra || '') + '</span>';
}
function owned(ev){ return S.tickets.filter(function(t){ return t.ev === ev && t.status !== 'scanned' && t.status !== 'sent'; }); }
function heldTotal(){ return S.tickets.filter(function(t){ return t.status === 'held'; }).reduce(function(a, t){ return a + t.paid; }, 0); }
function onWayTotal(){ return S.sales.filter(function(s){ return s.status === 'onway' || s.status === 'send'; }).reduce(function(a, s){ return a + s.amt; }, 0); }
function unreadCount(){ return S.threads.filter(function(t){ return t.unread; }).length; }
function thread(id){ return S.threads.filter(function(t){ return t.id === id; })[0]; }
function threadFor(name){
  var t = S.threads.filter(function(x){ return x.name === name; })[0];
  if (!t){ t = T('th' + (++seq), name, FRIENDS.indexOf(name) !== -1 ? 'Friends' : 'Offers', [], false, 'now'); S.threads.unshift(t); }
  return t;
}
function addActivity(a){ a.date = a.date || 'Today'; S.activity.unshift(a); }
function cityOf(w){ return CITIES.filter(function(c){ return c.id === (w || S.where).city; })[0] || CITIES[0]; }
function whereLabel(w){ w = w || S.where; return w.here ? 'Near USC' : cityOf(w).name; }
function whenLabel(w){ w = w || S.where; return w.when === 'Pick dates' ? 'Nov ' + w.range[0] + (w.range[1] !== w.range[0] ? '–' + w.range[1] : '') : w.when; }
function radiusMi(){ return { '1 mi':1, '5 mi':5, '25 mi':25, 'Any':999 }[S.where.radius]; }
function inWhen(e, when){
  when = when || S.where.when;
  if (when === 'Today') return e.day === TODAY;
  if (when === 'This weekend') return e.day === 7 || e.day === 8;
  if (when === 'This week') return e.day >= TODAY && e.day <= 8;
  if (when === 'This month') return e.day >= TODAY;
  return e.day >= S.where.range[0] && e.day <= S.where.range[1];
}
function nearEvents(when){
  var off = S.where.here ? 0 : cityOf().off;
  return UPCOMING.filter(function(id){ var e = EV[id]; return e.dist + off <= radiusMi() && inWhen(e, when) && (S.cat === 'All' || e.cat === S.cat); });
}

/* ================= navigation ================= */
var ROOTS = { tickets:'My Tickets', dashboard:'Dashboard', home:'Home', inbox:'Inbox', sell:'Sell' };
function cur(){ return S.stack.length ? S.stack[S.stack.length - 1] : { v:S.tab }; }
// Screens and sheets opened from the profile panel remember it, so Back returns to the panel.
var fromDrawer = false;
function go(v, p){ var o = p || {}; o.v = v; if (fromDrawer) o.fromDrawer = true; S.stack.push(o); S.overlay = null; render(true); }
function back(){ var top = S.stack.pop(); S.overlay = top && top.fromDrawer ? { k:'drawer' } : null; render(true); }
function tab(t){ S.tab = t; S.stack = []; S.overlay = null; render(true); }
function sheet(o){ if (fromDrawer) o.backTo = 'drawer'; S.overlay = o; renderOverlay(); }
function closeOverlay(){ S.overlay = S.overlay && S.overlay.backTo === 'drawer' ? { k:'drawer' } : null; renderOverlay(); }

var toastTimer, pushTimer, pushAction;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600); }
function push(title, body, action){
  var p = document.getElementById('push');
  document.getElementById('push-t').textContent = title;
  document.getElementById('push-b').textContent = body;
  pushAction = action;
  p.classList.add('show');
  clearTimeout(pushTimer); pushTimer = setTimeout(function(){ p.classList.remove('show'); }, 6000);
}
document.getElementById('push').onclick = function(){ this.classList.remove('show'); if (pushAction) pushAction(); };

    '</div>';
};

/* ---------- event: game hub (buy or sell) ---------- */
V.event = function(p){
  var e = EV[p.ev], mode = p.mode || 'buy', qty = p.qty || 2;
  var ls = S.listings.filter(function(l){ return l.ev === p.ev; }).sort(function(a, b){ return a.price - b.price; });
  var fit = ls.filter(function(l){ return l.seats >= qty; });
  var best = fit[0];
  var friends = FRIEND_PLANS.filter(function(f){ return f.ev === p.ev; })[0];
  if (p.offer == null) p.offer = best ? Math.max(5, Math.round(best.price * 0.85 / 5) * 5) : e.range[0];
  var reach = fit.filter(function(l){ return l.price > p.offer; }).length;
  var matchNow = fit.filter(function(l){ return l.price <= p.offer; }).length;
  var h = '<div class="hd line"><div class="row"><button class="backbtn" data-act="back" aria-label="Back">' + I.back + '</button><span class="grow"><span class="lt" style="font-size:1.15rem;font-weight:900">' + esc(e.name) + '</span><span class="ls">' + e.date + ' · ' + e.time + ' · ' + esc(e.venue) + '</span></span>' +
    '<button class="iconbtn' + (S.watch[p.ev] ? ' on' : '') + '" data-act="watch" data-ev="' + p.ev + '" aria-pressed="' + !!S.watch[p.ev] + '" aria-label="' + (S.watch[p.ev] ? 'Remove from watchlist' : 'Add to watchlist') + '">' + (S.watch[p.ev] ? I.heartOn : I.heart) + '</button></div>' +
    '<div class="seg big" role="group" aria-label="Buy or sell"><button class="' + (mode === 'buy' ? 'on' : '') + '" data-act="evmode" data-m="buy">Buy</button><button class="' + (mode === 'sell' ? 'on' : '') + '" data-act="evmode" data-m="sell">Sell</button></div></div>';
  if (mode === 'sell') return h + '<div class="body">' + sellForEvent(p.ev) + '</div>';
  h += '<div class="body">' +
    (friends ? '<button class="card tap row" data-act="go" data-v="friends"><span class="faces">' + friends.faces.map(function(f){ return av(f, 'xs'); }).join('') + '</span><span class="grow ls" style="margin:0;color:var(--ink)"><b>' + esc(friends.who) + '</b> going</span>' + I.chev + '</button>' : '') +
    '<div class="stack"><label class="lbl">How many?</label><div class="seg" role="group" aria-label="How many tickets">' + [1, 2, 3, 4].map(function(n){ return '<button class="' + (qty === n ? 'on' : '') + '" data-act="qty" data-n="' + n + '" aria-pressed="' + (qty === n) + '">' + (n === 4 ? '4+' : n) + '</button>'; }).join('') + '</div></div>';
  if (best){
    h += '<div class="card focus"><div class="between"><span class="eyebrow">Best value for ' + qty + '</span>' + (best.tag === 'Friend' ? '<span class="pill pill-lime">Friend</span>' : '') + '</div>' +
      '<div class="between" style="align-items:flex-start"><span><span class="lt" style="font-size:1.25rem;font-weight:900">' + esc(seatLabel(best)) + '</span><span class="ls">' + (best.seats > 1 ? best.seats + ' seats together' : '1 seat') + ' · ' + esc(best.tag) + '</span></span><span class="price" style="font-size:1.5rem">$' + best.price + '<small>each</small></span></div>' +
      '<div class="row">' + av(best.seller, 'sm') + '<span class="ls grow" style="margin:0"><b style="color:var(--ink)">' + esc(best.seller) + '</b> · verified USC · ' + best.trades + ' trades</span></div>' +
      '<div class="btn-grid"><button class="btn btn-ghost" data-act="seat" data-id="' + best.id + '">See seat</button><button class="btn btn-primary" data-act="checkout" data-id="' + best.id + '" data-qty="' + qty + '">Buy ' + qty + ' · $' + best.price * qty + '</button></div></div>';
  } else {
    h += '<div class="card"><span class="lt">Nobody is selling ' + qty + ' together yet</span><span class="sub">Post a request below and sellers come to you.</span></div>';
  }
  h += '<div class="card"><div class="between"><span class="eyebrow">Or name your price</span><span class="ls" style="margin:0">per ticket</span></div>' +
      '<div class="stepper"><button data-act="offerstep" data-d="-5" aria-label="Lower">−</button><span class="amt">$' + p.offer + '</span><button data-act="offerstep" data-d="5" aria-label="Higher">+</button></div>' +
      '<p class="sub" style="text-align:center">Seats for this game usually go for $' + e.range[0] + ' to $' + e.range[1] + '.</p>' +
      (matchNow ? '<button class="btn btn-primary btn-full" data-act="checkout" data-id="' + fit.filter(function(l){ return l.price <= p.offer; })[0].id + '" data-qty="' + qty + '">' + plural(matchNow, 'seller') + ' already at $' + p.offer + ' or less · Buy now</button>' : '') +
      (reach ? '<button class="btn btn-ink btn-full" data-act="offerall" data-ev="' + p.ev + '" data-qty="' + qty + '">Send $' + p.offer + ' to ' + plural(reach, 'seller') + ' with ' + qty + '+ seats</button>' : '') +
      '<button class="btn btn-ghost btn-full" data-act="postreq" data-ev="' + p.ev + '" data-qty="' + qty + '">Post a request at $' + p.offer + ' · sellers come to you</button></div>' +
    '<div class="stack" style="gap:0"><div class="between"><h2 class="h2">All seats</h2><span class="ls" style="margin:0">' + plural(fit.length, 'listing') + ' with ' + qty + (qty > 1 ? '+ together' : '') + '</span></div><div class="list">' +
      fit.map(function(l){ return '<button class="lrow two" data-act="seat" data-id="' + l.id + '"><span><span class="lt">' + esc(seatLabel(l)) + '</span><span class="ls">' + (l.seats === 1 ? '1 seat' : l.seats + ' seats together') + ' · ' + esc(l.seller) + '</span></span><span class="price">$' + l.price + ' ea<small class="tag">' + esc(l.tag) + '</small></span></button>'; }).join('') +
      (fit.length ? '' : '<p class="empty">No listings with ' + qty + ' seats together.</p>') + '</div></div>' +
    '<div class="shield">' + I.shield + '<span>Verified students only. Teezy holds your payment and the seller is paid after you scan in.</span></div></div>';
  return h;
};

function sellForEvent(ev){
  var mine = owned(ev).filter(function(t){ return t.status === 'held' || t.status === 'ready'; });
  var listed = S.selling.filter(function(s){ return s.ev === ev && !s.sold; });
  var reqs = S.requests.filter(function(r){ return r.ev === ev && !r.filled; });
  var h = '';
  if (listed.length) h += listed.map(sellingCard).join('');
  if (mine.length) h += '<div class="card"><span class="lt">Found in your account</span><span class="sub">' + mine.map(function(t){ return esc(t.sec + (t.row ? ', ' + t.row : '')) + ' · ' + plural(t.qty, 'ticket'); }).join('<br>') + '</span><button class="btn btn-primary btn-full" data-act="sellticket" data-id="' + mine[0].id + '">List at a suggested price</button></div>';
  if (!listed.length && !mine.length) h += '<div class="card"><span class="lt">No tickets for this game yet</span><span class="sub">Add tickets from Ticketmaster or AXS, or buy some first.</span><button class="btn btn-ghost btn-full" data-act="toast" data-msg="Connecting Ticketmaster isn\'t part of this demo">Add tickets from Ticketmaster or AXS</button></div>';
  h += '<div class="stack" style="gap:0"><h2 class="h2">People looking for this game</h2>' + (reqs.length ? '<div class="list">' + reqs.map(requestRow).join('') + '</div>' : '<p class="empty">No open requests for this game.</p>') + '</div>';
  return h;
}
function requestRow(r){
  var canFill = owned(r.ev).some(function(t){ return t.qty >= r.qty && t.status === 'held'; }) || S.selling.some(function(s){ return s.ev === r.ev && !s.sold && s.qty >= r.qty; });
  return '<div class="lrow">' + av(r.who, 'sm') + '<span><span class="lt">' + esc(r.who) + ' wants ' + r.qty + ' · ' + esc(EV[r.ev].name) + '</span><span class="ls">Up to $' + r.max + ' each · ' + esc(r.note) + '</span></span><button class="btn btn-sm ' + (canFill ? 'btn-primary' : 'btn-ghost') + '" data-act="fill" data-id="' + r.id + '"' + (canFill ? '' : ' disabled title="You need tickets for this game"') + '>Fill</button></div>';
}

V.seat = function(p){
  var l = listing(p.id), e = EV[l.ev];
  if (p.offer == null) p.offer = Math.round(l.price * 0.88);
  var chips = [0.82, 0.88, 0.94].map(function(f){ return Math.max(1, Math.round(l.price * f)); }).filter(function(c, i, a){ return a.indexOf(c) === i && c < l.price; });
  if (chips.indexOf(p.offer) === -1) p.offer = chips[chips.length - 1] || l.price;
  var qty = Math.min(p.qty || l.seats, l.seats);
  return '<div class="hd"><div class="row"><button class="backbtn" data-act="back" aria-label="Back">' + I.back + '</button><span class="ls" style="margin:0">' + esc(e.name) + ' · ' + e.date + '</span></div></div>' +
    '<div class="body">' +
      '<div class="stack" style="gap:6px"><h1 class="title">' + esc(seatLabel(l)) + '</h1><p class="sub" style="font-size:.95rem">' + (l.seats > 1 ? l.seats + ' seats together' : '1 seat') + ' · ' + esc(l.tag) + '</p></div>' +
      '<div class="stat-grid"><div class="stat"><span class="k">Asking</span><span class="v">$' + l.price + ' <span class="k">each</span></span></div><div class="stat"><span class="k">Similar seats sold for</span><span class="v">$' + e.range[0] + '–' + e.range[1] + '</span></div></div>' +
      '<div class="row">' + av(l.seller) + '<span class="grow"><span class="lt">' + esc(l.seller) + (l.tag === 'Friend' ? ' <span class="pill pill-lime">Friend</span>' : '') + '</span><span class="ls">Verified USC student · ' + l.trades + ' trades</span></span><button class="btn btn-sm btn-ghost" data-act="chatwith" data-name="' + esc(l.seller) + '">Message</button></div>' +
      (l.seats > 1 ? '<div class="stack"><label class="lbl">Tickets</label><div class="seg">' + Array.from({ length:l.seats }, function(_, i){ var n = i + 1; return '<button class="' + (qty === n ? 'on' : '') + '" data-act="seatqty" data-n="' + n + '">' + n + '</button>'; }).join('') + '</div></div>' : '') +
      '<div class="shield">' + I.shield + '<span>Teezy holds your payment. ' + esc(l.seller.split(' ')[0]) + ' gets paid only after you scan in.</span></div>' +

function calendarPlans(){

  S.sales.forEach(function(s){ if (!EV[s.ev].past) add(EV[s.ev].day, { k:'selling', ev:s.ev, sub:'Sold to ' + s.who }); });

  UPCOMING.forEach(function(id){ if (S.watch[id] && !(plans[EV[id].day] || []).some(function(x){ return x.ev === id; })) add(EV[id].day, { k:'watching', ev:id, sub:EV[id].venue + ' · from $' + fromPrice(id) }); });

}

A.sendcounter = function(){
  var o = S.offers.filter(function(x){ return x.id === S.overlay.id; })[0], p = S.overlay.p;
  o.history.push(['You', p]); o.status = 'waiting'; o.left = 'sent just now';
  closeOverlay();
  toast('Counter sent');
  later(function(){
    var last = o.history[o.history.length - 2][1];
    var meet = p >= last - 2 ? p : Math.round((p + last) / 2);
    o.status = 'counter'; o.history.push([o.to.split(' ')[0], meet]); o.left = meet === p ? 'Accepted · pay within 1h' : '23h left';
    var t = o.id === 'o-maya' ? thread('maya') : threadFor(o.to); t.msgs.push({ me:1, offer:p }); t.msgs.push(meet === p ? { text:'Fine, $' + p + ' works. Accept and they\'re yours.' } : { offer:meet }); t.unread = true; t.when = 'now';
    push(meet === p ? o.to.split(' ')[0] + ' accepted $' + p : o.to.split(' ')[0] + ' countered at $' + meet, EV[o.ev].name, function(){ openSaved('Offers'); });
  }, 2400);
  render();
};
A.raise = function(d){

};
A.cancelOffer = function(d){ S.offers = S.offers.filter(function(x){ return x.id !== d.id; }); toast('Offer canceled'); render(); };

A.thread = function(d){ go('chat', { id:d.id }); };
A.chatwith = function(d){ var t = threadFor(d.name); go('chat', { id:t.id }); };
function reply(t, text, ms){
  var c = cur(); c.typing = true; render();
  setTimeout(function(){ c.typing = false; t.msgs.push({ text:text }); render(); }, ms || 1300);
}
A.mayaoffer = function(){
  var t = thread('maya'), o = S.offers.filter(function(x){ return x.id === 'o-maya'; })[0], last = o.history[o.history.length - 1][1];
  t.msgs.push({ me:1, offer:last - 1 }); o.history.push(['You', last - 1]);
  reply(t, 'Ha, fine. $' + (last - 1) + ' it is. Accept and I\'ll send the transfer tonight.');
  setTimeout(function(){ o.history.push(['Maya', last - 1]); render(); }, 1350);
};
A.mayaq = function(d){ var t = thread('maya'); t.msgs.push({ me:1, text:d.q }); reply(t, 'Row 24, right on the 50 in the student section. You can see the whole field.'); };
A.mayadecline = function(){

A.showpermit = function(){ toast('Permit 8XYZ214 · valid until Dec 18 at Grand Ave'); };
A.sellparking = function(){ S.parking[1].listed = true; toast('Game day parking listed for $25'); render(); };
A.showticket = function(d){ sheet({ k:'ticket', id:d.id }); };
A.scan = function(d){
  var t = S.tickets.filter(function(x){ return x.id === d.id; })[0];
  t.status = 'scanned';

  closeOverlay(); toast('You\'re in. ' + money(t.paid) + ' released to ' + nm(t.from) + '.'); render();
};
A.transfer = function(d){ sheet({ k:'transfer', id:d.id }); };
A.dotransfer = function(d){
  var t = S.tickets.filter(function(x){ return x.id === d.id; })[0];
  t.status = 'sent'; t.sentTo = d.to;

  closeOverlay(); toast('Sent to ' + d.to); render();
};
A.sellticket = function(d){ S.sellPick = d.id; S.sellPrice = null; tab('sell'); };
A.sellpick = function(d){ S.sellPick = d.id; S.sellPrice = null; render(); };
A.sellprice = function(d){ S.sellPrice = +d.n; render(); };
A.selloffers = function(){ S.sellOffers = S.sellOffers === false; render(); };
A.listnow = function(){
  var t = S.tickets.filter(function(x){ return x.id === S.sellPick; })[0];
  S.tickets = S.tickets.filter(function(x){ return x !== t; });
  var s = { id:uid('s'), ev:t.ev, sec:t.sec, row:t.row, qty:t.qty, price:S.sellPrice, views:0, acceptOffers:S.sellOffers !== false, offers:[] };
  S.selling.unshift(s);
  toast('Listed. Friends and people watching ' + EV[t.ev].name + ' hear first.');
  S.sellPick = null; S.sellPrice = null;
  if (s.acceptOffers) later(function(){
    s.views = 12; s.offers.push({ who:'Kai L.', amt:Math.max(5, s.price - 6) });
    push('New offer · $' + (s.price - 6) + ' each', 'Kai L. · ' + EV[s.ev].name, function(){ S.ticketsTab = 'Selling'; tab('tickets'); });
  }, 3200);
  S.ticketsTab = 'Selling'; tab('tickets');
};
function sell(s, who, amt){
  s.sold = true;
  var sale = { id:uid('sale'), ev:s.ev, who:who, qty:s.qty, amt:Math.round(amt * s.qty * 0.95 * 100) / 100, status:'send' };
  S.sales.unshift(sale);
  addActivity({ type:'Sales', ic:'SOLD', t:'Sold ' + plural(s.qty, 'ticket') + ' to ' + who, s:EV[s.ev].name + ' · send the transfer', amt:sale.amt });
  return sale;
}
A.seeoffers = function(d){ sheet({ k:'offers', id:d.id }); };
A.takeoffer = function(d){
  var s = S.selling.filter(function(x){ return x.id === d.id; })[0], o = s.offers[+d.i];
  sell(s, o.who, o.amt);
  closeOverlay(); toast('Sold to ' + nm(o.who) + '. Send the transfer next.'); render();
};
A.declineoffer = function(d){
  var s = S.selling.filter(function(x){ return x.id === d.id; })[0];
  s.offers.splice(+d.i, 1);
  if (!s.offers.length) closeOverlay(); else renderOverlay();
  render();
};
A.editprice = function(d){ sheet({ k:'price', id:d.id }); };
A.pstep = function(d){ S.overlay.p = Math.max(5, S.overlay.p + (+d.d)); renderOverlay(); };
A.saveprice = function(){
  var s = S.selling.filter(function(x){ return x.id === S.overlay.id; })[0], dropped = S.overlay.p < s.price;
  s.price = S.overlay.p; closeOverlay();
  toast(dropped ? 'Price dropped. 9 people watching this game got an alert.' : 'Price updated');
  render();
};
A.sendtix = function(d){
  var s = S.sales.filter(function(x){ return x.id === d.id; })[0];
  s.status = 'onway';
  toast('Transfer sent to ' + nm(s.who) + '. You\'re paid after the game.');
  render();
};
A.fill = function(d){
  var r = S.requests.filter(function(x){ return x.id === d.id; })[0];
  var s = S.selling.filter(function(x){ return x.ev === r.ev && !x.sold && x.qty >= r.qty; })[0];
  if (!s){
    var t = owned(r.ev).filter(function(x){ return x.qty >= r.qty && x.status === 'held'; })[0];
    S.tickets = S.tickets.filter(function(x){ return x !== t; });
    s = { id:uid('s'), ev:t.ev, sec:t.sec, row:t.row, qty:r.qty, price:r.max, views:0, offers:[] };
    S.selling.push(s);
  }
  s.qty = r.qty;
  r.filled = true;
  sell(s, r.who, r.max);
  var th = threadFor(r.who); th.msgs.push({ text:'Thank you!! Send whenever.' }); th.unread = true; th.when = 'now';
  toast('Sold to ' + r.who + ' at $' + r.max + '. Send the transfer from your Dashboard.');
  render();
};
A.addfriend = function(d){ S.friendsAdded[d.id] = !S.friendsAdded[d.id]; render(); };

A.invite = function(){

A.orgroster = function(){ S.org.roster = !S.org.roster; render(); };

A.settings = function(){ sheet({ k:'settings' }); };
A.set = function(d){ S.settings[d.k] = !S.settings[d.k]; renderOverlay(); };
A.theme = function(d){ S.settings.theme = d.t; applyTheme(); try { localStorage.setItem('teezy-theme', d.t); } catch (e){} renderOverlay(); };
// Light and Dark pin the palette; Auto hands it back to the device (or the viewer's own theme setting).
var hostTheme = document.documentElement.getAttribute('data-theme');
function applyTheme(){
  var t = S.settings.theme, root = document.documentElement;
  if (t === 'Auto'){ if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', t.toLowerCase());
}
try { var savedTheme = localStorage.getItem('teezy-theme'); if (['Auto', 'Light', 'Dark'].indexOf(savedTheme) !== -1) S.settings.theme = savedTheme; } catch (e){}
applyTheme();
A.calday = function(d){ cur().day = +d.d; render(); };
A['where-here'] = function(){ S.whereDraft.here = true; S.whereDraft.city = 'usc'; renderOverlay(); };
A.wcity = function(d){ var w = S.whereDraft, c = CITIES.filter(function(x){ return x.id === d.c; })[0]; w.here = false; w.city = c.id; w.q = ''; if (c.off > 5 && w.radius !== 'Any') w.radius = c.off > 25 ? 'Any' : '25 mi'; renderOverlay(); };
A.wradius = function(d){ S.whereDraft.radius = d.r; renderOverlay(); };

  var r = S.whereDraft.range, n = +d.d;
  if (r[0] !== r[1] || n < r[0]) S.whereDraft.range = [n, n]; else S.whereDraft.range = [r[0], n];
  renderOverlay();
};

A.wapply = function(){ S.where = S.whereDraft; delete S.where.q; S.whereDraft = null; S.overlay = null; render(true); };

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  // Drawer and sheet links close the overlay first, except actions that change the overlay itself.
  var keep = ['close', 'theme', 'invite', 'wcity', 'pay', 'cstep', 'sendcounter', 'pstep', 'saveprice', 'where-here', 'wradius', 'wwhen', 'wday', 'wreset', 'wapply', 'set', 'dosplit', 'takeoffer', 'declineoffer', 'scan', 'dotransfer'];
  var inOverlay = t.closest('#overlay');
  fromDrawer = !!(inOverlay && S.overlay && S.overlay.k === 'drawer');
  if (inOverlay && keep.indexOf(t.dataset.act) === -1 && t.dataset.act !== 'drawer') S.overlay = null;
  var fn = A[t.dataset.act];
  if (fn){ e.preventDefault(); fn(t.dataset, t); if (inOverlay && !S.overlay) renderOverlay(); }
  fromDrawer = false;
});
document.addEventListener('input', function(e){
  var k = e.target.dataset && e.target.dataset.input;
  if (!k) return;
  if (k === 'q'){ S.q = e.target.value; render(); }
  else if (k === 'wq'){ S.whereDraft.q = e.target.value; renderOverlay(); }
  else if (k.indexOf('org.') === 0){ S.org[k.slice(4)] = e.target.value; render(); }
});
document.addEventListener('submit', function(e){
  if (e.target.dataset.form !== 'msg') return;
  e.preventDefault();
  var input = e.target.querySelector('input'), text = input.value.trim();
  if (!text) return;
  var t = thread(cur().id);
  t.msgs.push({ me:1, text:text }); t.when = 'now';
  input.value = '';
  var canned = { 'Maya R.':'Sounds good! Let me know on the offer.', 'Theo':'Yes!! Get a ticket, Ana is selling one.', 'Ana':'Want it? I can send it tonight.', 'Sig Ep':'Thanks! The treasurer will see this.', 'Teezy':'Thanks. A teammate will reply here within a day.' };
  reply(t, canned[t.name] || 'Got it. Talk soon.');
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.overlay) closeOverlay(); });

render(true);
})();
